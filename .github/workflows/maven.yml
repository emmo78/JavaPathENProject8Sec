# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time

name: TourGuide CI

on:
  push:
    branches: [ master, develop, 'feature/addGitHubCI' ]
  pull_request:
    branches: [ master, develop, 'feature/addGitHubCI' ]

jobs:
  beforeAll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'
      - name: Run mvn install
        run: |
          mvn -B --file './TourGuide/pom.xml' install:install-file -Dfile='./libs/gpsUtil.jar' -DgroupId=gpsUtil -DartifactId=gpsUtil -Dversion=1.0.0 -Dpackaging=jar
          mvn -B --file './TourGuide/pom.xml' install:install-file -Dfile='./libs/RewardCentral.jar' -DgroupId=rewardCentral -DartifactId=rewardCentral -Dversion=1.0.0 -Dpackaging=jar
          mvn -B --file './TourGuide/pom.xml' install:install-file -Dfile='./libs/TripPricer.jar' -DgroupId=tripPricer -DartifactId=tripPricer -Dversion=1.0.0 -Dpackaging=jar

  build:
    needs: beforeAll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'
      - name: Build, Test, Package with Maven
        run: mvn -B --file './TourGuide/pom.xml' package
      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      #- name: Update dependency graph
      #  uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6