# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time

name: TourGuide CI
on:
  push:
    branches: [ master, develop, 'feature/addGitHubCI' ]
  pull_request:
    branches: [ master, develop, 'feature/addGitHubCI' ]
defaults:
  run:
    working-directory: TourGuide
jobs:
  installDependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven
      - name: Run mvn install
        run: |
          mvn -B install:install-file -Dfile=./libs/gpsUtil.jar -DgroupId=gpsUtil -DartifactId=gpsUtil -Dversion=1.0.0 -Dpackaging=jar
          mvn -B install:install-file -Dfile=./libs/RewardCentral.jar -DgroupId=rewardCentral -DartifactId=rewardCentral -Dversion=1.0.0 -Dpackaging=jar
          mvn -B install:install-file -Dfile=./libs/TripPricer.jar -DgroupId=tripPricer -DartifactId=tripPricer -Dversion=1.0.0 -Dpackaging=jar
  build:
    needs: installDependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Maven
        uses: actions/cache@v4
        with:
          key: maven
        run: mvn -B compile
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test, Package with Maven
        run: |
          echo 'Skip TestPerformance'
          mvn -B test -Dtest='!TestPerformance'
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
      - name: Package with Maven
        run: mvn -B package
  # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6